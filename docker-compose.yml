version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: arb-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: arb_bot
      POSTGRES_USER: arb_user
      POSTGRES_PASSWORD: arb_dev_pass
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped

volumes:
  tsdb_data:
